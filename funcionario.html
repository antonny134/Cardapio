<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Funcionário</title>
    <style>
        :root {
            --bg: #14110f;
            --card: #1f1a17;
            --card-2: #2a2420;
            --borda: #3a322c;
            --texto: #f5ede4;
            --suave: #a99b8d;
            --destaque: #ff8a3d;
            --destaque-2: #ffb347;
            --ok: #4ade80;
            --erro: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 138, 61, .15), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(255, 179, 71, .10), transparent 45%),
                var(--bg);
            padding: 28px 16px 60px;
        }

        main {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 24px;
            align-items: start;
        }

        .titulo { grid-column: 1 / -1; text-align: center; }
        .titulo h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.5px; }
        .titulo h1 span {
            background: linear-gradient(90deg, var(--destaque), var(--destaque-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .titulo p { color: var(--suave); font-size: .92rem; margin-top: 6px; }

        .painel {
            background: var(--card);
            border: 1px solid var(--borda);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
        }
        .painel h2 { font-size: 1.05rem; margin-bottom: 16px; }

        adicionar.add { display: flex; flex-direction: column; gap: 16px; }

        .campo { display: flex; flex-direction: column; gap: 7px; }
        .campo > label {
            font-size: .78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--suave);
        }

        .campo input[type="text"], .campo select {
            width: 100%;
            background: var(--card-2);
            border: 1.5px solid var(--borda);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--texto);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .campo input::placeholder { color: #6f645a; }
        .campo input[type="text"]:focus, .campo select:focus {
            border-color: var(--destaque);
            box-shadow: 0 0 0 4px rgba(255, 138, 61, .15);
        }

        .preco { position: relative; }
        .preco span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--destaque);
            font-weight: 700;
            pointer-events: none;
        }
        .preco input { padding-left: 46px !important; }

        #img { display: none; }
        .upload {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 150px;
            border: 2px dashed var(--borda);
            border-radius: 14px;
            background: var(--card-2);
            cursor: pointer;
            overflow: hidden;
            text-align: center;
            padding: 16px;
            transition: border-color .2s, background .2s;
        }
        .upload:hover, .upload.arrastando {
            border-color: var(--destaque);
            background: rgba(255, 138, 61, .07);
        }
        .upload .icone { font-size: 2rem; }
        .upload strong { font-size: .95rem; }
        .upload small { color: var(--suave); font-size: .8rem; }
        .upload img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .upload.com-imagem img { display: block; }
        .upload.com-imagem > *:not(img) { display: none; }

        button.principal {
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            color: #1a1208;
            cursor: pointer;
            background: linear-gradient(90deg, var(--destaque), var(--destaque-2));
            box-shadow: 0 10px 25px rgba(255, 138, 61, .3);
            transition: transform .15s, box-shadow .15s, opacity .15s;
        }
        button.principal:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255, 138, 61, .4); }
        button.principal:disabled { opacity: .6; cursor: wait; transform: none; }

        /* lista */
        .cabecalho-lista {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 10px;
        }
        .cabecalho-lista h2 { margin: 0; }
        .contador {
            font-size: .8rem;
            color: var(--suave);
            background: var(--card-2);
            border: 1px solid var(--borda);
            padding: 4px 12px;
            border-radius: 999px;
        }

        #lista { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; padding-right: 4px; }

        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card-2);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 10px;
        }
        .item img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            background: #14110f;
            flex-shrink: 0;
        }
        .item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .item strong { font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item small { color: var(--suave); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item .preco-item { color: var(--destaque); font-weight: 800; font-size: .92rem; }
        .item .tag {
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--suave);
        }
        .item button {
            border: 1px solid var(--borda);
            background: transparent;
            color: var(--erro);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            flex-shrink: 0;
        }
        .item button:hover { background: rgba(248, 113, 113, .12); border-color: var(--erro); }

        .vazio { color: var(--suave); text-align: center; padding: 30px 0; font-size: .92rem; }

        .aviso {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 120px);
            background: var(--card);
            border: 1px solid var(--borda);
            border-left: 4px solid var(--ok);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: .92rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            transition: transform .35s ease;
            max-width: calc(100% - 32px);
            z-index: 10;
        }
        .aviso.erro { border-left-color: var(--erro); }
        .aviso.mostrar { transform: translate(-50%, 0); }

        @media (max-width: 860px) {
            main { grid-template-columns: 1fr; }
            #lista { max-height: none; }
        }
        @media (max-width: 480px) {
            .painel { padding: 16px; border-radius: 16px; }
            .titulo h1 { font-size: 1.45rem; }
        }
    </style>
</head>
<body>
    <main>
        <div class="titulo">
            <h1>Painel do <span>Funcionário</span></h1>
            <p>Adicione ou remova itens do cardápio</p>
        </div>

        <section class="painel">
            <h2>Adicionar produto</h2>
            <adicionar class="add">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome Do Produto">
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="lanche">Lanche</option>
                        <option value="bebida">Bebida</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <div class="preco">
                        <span>R$</span>
                        <input type="text" id="valor" placeholder="Valor Do Produto" inputmode="numeric">
                    </div>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Descrição">
                </div>

                <div class="campo">
                    <label>Imagem</label>
                    <label class="upload" id="upload" for="img">
                        <img id="preview" alt="Prévia da imagem">
                        <strong>Clique ou arraste uma imagem</strong>
                        <small>PNG, JPG ou WEBP</small>
                    </label>
                    <input type="file" name="Imagem" id="img" accept="image/*">
                </div>

                <button class="principal" type="button" id="salvar">Adicionar produto</button>
            </adicionar>
        </section>

        <section class="painel">
            <div class="cabecalho-lista">
                <h2>Cardápio atual</h2>
                <span class="contador" id="contador">0 itens</span>
            </div>
            <div id="lista"></div>
        </section>
    </main>

    <div class="aviso" id="aviso"></div>

    <script>
        const $ = (id) => document.getElementById(id);
        const upload = $("upload");
        const inputImg = $("img");
        const preview = $("preview");
        const valor = $("valor");
        let imagemBase64 = "";

        function aviso(texto, erro = false) {
            const el = $("aviso");
            el.textContent = texto;
            el.classList.toggle("erro", erro);
            el.classList.add("mostrar");
            clearTimeout(aviso.t);
            aviso.t = setTimeout(() => el.classList.remove("mostrar"), 2800);
        }

        function moeda(n) {
            return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        }

        function escapar(texto) {
            const d = document.createElement("div");
            d.textContent = texto;
            return d.innerHTML;
        }

        /* ---------- imagem ---------- */
        function lerImagem(arquivo) {
            if (!arquivo || !arquivo.type.startsWith("image/")) return;
            const leitor = new FileReader();
            leitor.onload = () => {
                imagemBase64 = leitor.result;
                preview.src = imagemBase64;
                upload.classList.add("com-imagem");
            };
            leitor.readAsDataURL(arquivo);
        }

        inputImg.addEventListener("change", () => lerImagem(inputImg.files[0]));
        ["dragenter", "dragover"].forEach((ev) =>
            upload.addEventListener(ev, (e) => { e.preventDefault(); upload.classList.add("arrastando"); })
        );
        ["dragleave", "drop"].forEach((ev) =>
            upload.addEventListener(ev, (e) => { e.preventDefault(); upload.classList.remove("arrastando"); })
        );
        upload.addEventListener("drop", (e) => lerImagem(e.dataTransfer.files[0]));

        /* ---------- máscara de preço ---------- */
        valor.addEventListener("input", () => {
            const n = valor.value.replace(/\D/g, "");
            valor.value = n
                ? (parseInt(n, 10) / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2 })
                : "";
        });

        /* ---------- ler o banco (GET) ---------- */
        async function carregar() {
            try {
                const [lanches, bebidas] = await Promise.all([
                    fetch("/produtos").then((r) => r.json()),
                    fetch("/suco").then((r) => r.json()),
                ]);

                const todos = [
                    ...lanches.map((p) => ({ ...p, tag: "Lanche" })),
                    ...bebidas.map((p) => ({ ...p, tag: "Bebida" })),
                ];

                $("contador").textContent = todos.length + (todos.length === 1 ? " item" : " itens");

                $("lista").innerHTML = todos.length
                    ? todos.map((p) => `
                        <div class="item">
                            <img src="${p.url_foto}" alt="" onerror="this.style.visibility='hidden'">
                            <div class="info">
                                <span class="tag">${p.tag}</span>
                                <strong>${escapar(p.nome)}</strong>
                                <small>${escapar(p.descricao || "")}</small>
                                <span class="preco-item">${moeda(p.valor)}</span>
                            </div>
                            <button title="Remover" onclick="apagar(${p.id_produto})">🗑</button>
                        </div>`).join("")
                    : '<p class="vazio">Nenhum produto cadastrado.</p>';
            } catch {
                aviso("Não foi possível carregar o cardápio. O servidor está rodando?", true);
            }
        }

        /* ---------- gravar no banco (POST) ---------- */
        $("salvar").addEventListener("click", async () => {
            const nome = $("nome").value.trim();
            const preco = Number(valor.value.replace(/\./g, "").replace(",", "."));

            if (!nome || !preco) return aviso("Informe pelo menos o nome e o valor.", true);

            const botao = $("salvar");
            botao.disabled = true;

            try {
                const resposta = await fetch("/produtos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nome,
                        descricao: $("descricao").value.trim(),
                        valor: preco,
                        url_foto: imagemBase64,
                        categoria: $("categoria").value,
                    }),
                });
                if (!resposta.ok) throw new Error();

                $("nome").value = "";
                valor.value = "";
                $("descricao").value = "";
                inputImg.value = "";
                imagemBase64 = "";
                upload.classList.remove("com-imagem");

                aviso("Produto adicionado com sucesso!");
                carregar();
            } catch {
                aviso("Erro ao salvar o produto.", true);
            } finally {
                botao.disabled = false;
            }
        });

        /* ---------- apagar (DELETE) ---------- */
        async function apagar(id) {
            if (!confirm("Remover este produto do cardápio?")) return;
            try {
                const resposta = await fetch("/produtos/" + id, { method: "DELETE" });
                if (!resposta.ok) throw new Error();
                aviso("Produto removido.");
                carregar();
            } catch {
                aviso("Erro ao remover o produto.", true);
            }
        }

        carregar();
    </script>
</body>
</html>
