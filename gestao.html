<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadárpio | Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      * { padding: 0; box-sizing: border-box; margin: 0; }
      [hidden] { display: none !important; }
      :root {
        --papel: #f6ead4;
        --papel-claro: #fff8e8;
        --tinta: #1b1410;
        --laranja: #ff6a13;
        --mostarda: #ffc233;
        --ketchup: #d62828;
        --verde: #2f9e44;
        --sombra: 6px 6px 0 var(--tinta);
        --display: "Anton", "Impact", "Arial Narrow", sans-serif;
        --texto: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
        --mono: "Space Mono", ui-monospace, "Courier New", monospace;
      }
      body {
        font-family: var(--texto);
        color: var(--tinta);
        background-color: var(--papel);
        background-image: radial-gradient(rgba(27, 20, 16, 0.12) 1px, transparent 1px);
        background-size: 18px 18px;
        min-height: 100vh;
      }
      button, input, select, textarea { font-family: inherit; color: inherit; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--laranja);
        outline-offset: 2px;
      }

      /* ---------- header ---------- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px 28px;
        background: var(--mostarda);
        border-bottom: 3px solid var(--tinta);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .marca { display: flex; align-items: center; gap: 14px; }
      .logo {
        font-family: var(--display);
        font-size: 1.5rem;
        letter-spacing: 1px;
        background: var(--laranja);
        color: var(--papel-claro);
        border: 3px solid var(--tinta);
        box-shadow: 4px 4px 0 var(--tinta);
        padding: 4px 12px;
        transform: rotate(-2deg);
      }
      header h3 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .topo-dir { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .data, .conexao {
        font-family: var(--mono);
        font-size: 0.78rem;
        font-weight: 700;
        background: var(--papel-claro);
        border: 2px solid var(--tinta);
        padding: 6px 12px;
      }
      .data { text-transform: capitalize; }
      .conexao::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid var(--tinta);
        background: var(--ketchup);
        margin-right: 8px;
      }
      .conexao.on::before { background: var(--verde); }

      main {
        max-width: 1150px;
        margin: 0 auto;
        padding: 32px 20px 60px;
        display: grid;
        gap: 30px;
      }

      /* ---------- stats ---------- */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 22px;
      }
      .stat {
        background: var(--papel-claro);
        border: 3px solid var(--tinta);
        box-shadow: var(--sombra);
        padding: 18px 20px;
        position: relative;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .stat:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--tinta); }
      .stat small {
        font-family: var(--mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .stat strong {
        display: block;
        font-family: var(--display);
        font-weight: 400;
        font-size: 2.6rem;
        margin-top: 6px;
        line-height: 1.1;
      }
      .stat::after {
        content: "";
        position: absolute;
        top: -3px;
        right: 16px;
        width: 34px;
        height: 14px;
        border: 3px solid var(--tinta);
        border-top: none;
        background: var(--cor, var(--laranja));
      }
      .stat:nth-child(2) { --cor: var(--mostarda); }
      .stat:nth-child(3) { --cor: var(--ketchup); }
      .stat:nth-child(4) { --cor: var(--verde); }
      .stat.clicavel {
        font: inherit;
        text-align: left;
        width: 100%;
        color: inherit;
        cursor: pointer;
      }
      .stat.clicavel:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--tinta); }
      .stat .dica {
        display: block;
        margin-top: 8px;
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.65;
      }
      .stat.clicavel:hover .dica { opacity: 1; color: var(--ketchup); }

      /* ---------- abas ---------- */
      .abas { display: flex; gap: 12px; flex-wrap: wrap; }
      .aba {
        font-family: var(--display);
        font-size: 1.15rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: var(--papel-claro);
        border: 3px solid var(--tinta);
        padding: 8px 22px;
        cursor: pointer;
        box-shadow: 4px 4px 0 var(--tinta);
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .aba:hover { transform: translate(-1px, -1px); }
      .aba.ativa {
        background: var(--laranja);
        color: var(--papel-claro);
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--tinta);
      }
      .aba .n {
        font-family: var(--mono);
        font-size: 0.75rem;
        background: var(--tinta);
        color: var(--mostarda);
        padding: 1px 7px;
        border-radius: 99px;
        margin-left: 6px;
        vertical-align: middle;
      }

      section.painel { display: none; }
      section.painel.ativo { display: block; }

      .titulo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .titulo h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .titulo span { font-family: var(--mono); font-size: 0.78rem; }

      /* ---------- botões ---------- */
      .btn {
        font-family: var(--display);
        font-size: 1.05rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: var(--laranja);
        color: var(--papel-claro);
        border: 3px solid var(--tinta);
        box-shadow: 4px 4px 0 var(--tinta);
        padding: 8px 22px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--tinta); }
      .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
      .btn:disabled { opacity: 0.6; cursor: wait; }
      .btn.claro { background: var(--papel-claro); color: var(--tinta); }
      .mini {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        border: 2px solid var(--tinta);
        background: var(--papel);
        padding: 5px 9px;
        cursor: pointer;
      }
      .mini:hover { background: var(--mostarda); }
      .mini.del:hover { background: var(--ketchup); color: #fff; }

      /* ---------- filtros ---------- */
      .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
      .chip {
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        border: 2px solid var(--tinta);
        background: var(--papel-claro);
        padding: 6px 12px;
        cursor: pointer;
      }
      .chip.ativo { background: var(--tinta); color: var(--mostarda); }

      /* ---------- pedidos ---------- */
      .pedidos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 24px;
      }
      .pedido {
        background: var(--papel-claro);
        border: 3px solid var(--tinta);
        box-shadow: var(--sombra);
        padding: 16px 18px;
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .pedido.novo { animation: chega 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); border-color: var(--ketchup); }
      @keyframes chega { from { transform: scale(0.9) rotate(-2deg); opacity: 0; } }
      .pedido-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .pedido-topo b { font-family: var(--display); font-weight: 400; font-size: 1.4rem; letter-spacing: 1px; }
      .hora { font-family: var(--mono); font-size: 0.75rem; }
      .pedido-cli { font-weight: 800; font-size: 1.1rem; }
      .info { font-family: var(--mono); font-size: 0.78rem; display: grid; gap: 2px; }
      .info em { font-style: normal; font-weight: 700; }
      .obs {
        font-size: 0.85rem;
        background: var(--mostarda);
        border: 2px solid var(--tinta);
        padding: 6px 10px;
        overflow-wrap: anywhere;
      }
      .pedido ul {
        list-style: none;
        font-family: var(--mono);
        font-size: 0.82rem;
        border-top: 2px dashed var(--tinta);
        border-bottom: 2px dashed var(--tinta);
        padding: 8px 0;
        display: grid;
        gap: 4px;
      }
      .pedido li { display: flex; justify-content: space-between; gap: 10px; }
      .pedido-rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .total { font-family: var(--display); font-size: 1.5rem; }
      .pedido-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .status {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        border: 2px solid var(--tinta);
        padding: 5px 10px;
        cursor: pointer;
        background: var(--mostarda);
      }
      .status.novo { background: var(--ketchup); color: var(--papel-claro); }
      .status.pronto { background: var(--laranja); color: var(--papel-claro); }
      .status.entregue { background: var(--verde); color: var(--papel-claro); }

      /* ---------- produtos ---------- */
      .tabela-wrap {
        background: var(--papel-claro);
        border: 3px solid var(--tinta);
        box-shadow: var(--sombra);
        overflow-x: auto;
      }
      table { width: 100%; border-collapse: collapse; min-width: 640px; }
      th {
        font-family: var(--mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: left;
        background: var(--tinta);
        color: var(--mostarda);
        padding: 12px 14px;
      }
      td { padding: 10px 14px; border-bottom: 2px solid rgba(27, 20, 16, 0.15); font-weight: 600; vertical-align: middle; }
      tr:last-child td { border-bottom: none; }
      td.preco { font-family: var(--mono); font-weight: 700; white-space: nowrap; }
      td img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid var(--tinta);
        background: var(--mostarda);
        display: block;
      }
      td small { display: block; font-weight: 400; opacity: 0.7; font-size: 0.78rem; max-width: 340px; }
      .tag {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        background: var(--mostarda);
        border: 2px solid var(--tinta);
        padding: 2px 8px;
      }
      .tag.bebida { background: var(--laranja); color: var(--papel-claro); }
      .acoes { display: flex; gap: 8px; }
      .vazio { font-family: var(--mono); text-align: center; padding: 30px; grid-column: 1 / -1; }

      /* ---------- modal ---------- */
      dialog {
        margin: auto;
        width: min(92vw, 460px);
        padding: 26px 24px 22px;
        border: 3px solid var(--tinta);
        background: var(--papel-claro);
        color: var(--tinta);
        box-shadow: 10px 10px 0 var(--tinta);
      }
      dialog::backdrop { background: rgba(27, 20, 16, 0.7); backdrop-filter: blur(3px); }
      dialog h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.9rem;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .campos { display: grid; gap: 12px; }
      .campos label {
        display: grid;
        gap: 5px;
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .campos input, .campos select, .campos textarea {
        width: 100%;
        padding: 9px 11px;
        font: 400 0.95rem var(--texto);
        text-transform: none;
        letter-spacing: 0;
        background: var(--papel);
        border: 2px solid var(--tinta);
        resize: vertical;
      }
      .campos input:focus, .campos select:focus, .campos textarea:focus { background: #fff; }
      .linha-foto { display: flex; gap: 8px; }
      .linha-foto input { flex: 1; min-width: 0; }
      .erro-form { color: var(--ketchup); font-weight: 800; font-size: 0.85rem; }
      .modal-botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

      /* ---------- faturamento detalhado ---------- */
      dialog.grande {
        width: min(96vw, 1040px);
        max-height: 92vh;
        overflow-y: auto;
        padding: 24px 24px 22px;
      }
      .fat-topo {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .fat-topo h2 { margin-bottom: 0; }
      .fat-topo p { font-family: var(--mono); font-size: 0.75rem; margin-top: 4px; text-transform: capitalize; }
      .fat-ctrl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .seg { display: flex; border: 3px solid var(--tinta); background: var(--papel); }
      .seg button {
        font-family: var(--mono);
        font-size: 0.74rem;
        font-weight: 700;
        text-transform: uppercase;
        background: transparent;
        border: none;
        border-right: 2px solid var(--tinta);
        padding: 7px 14px;
        cursor: pointer;
      }
      .seg button:last-child { border-right: none; }
      .seg button.ativo { background: var(--tinta); color: var(--mostarda); }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .kpi {
        border: 3px solid var(--tinta);
        background: var(--papel);
        padding: 11px 13px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .kpi.destaque { background: var(--mostarda); }
      .kpi small {
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .kpi strong { font-family: var(--display); font-weight: 400; font-size: 1.75rem; line-height: 1.1; }
      .kpi .sub { font-family: var(--mono); font-size: 0.68rem; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .delta {
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 700;
        border: 2px solid var(--tinta);
        padding: 1px 6px;
        background: var(--papel-claro);
        white-space: nowrap;
      }
      .delta.up { background: var(--verde); color: #fff; }
      .delta.down { background: var(--ketchup); color: #fff; }
      .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
      .grafico { border: 3px solid var(--tinta); background: #fffdf5; padding: 14px 16px 16px; min-width: 0; }
      .grafico.largo { grid-column: 1 / -1; }
      .grafico h4 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 1.1rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .grafico .leg { font-family: var(--mono); font-size: 0.68rem; opacity: 0.7; margin-bottom: 12px; }
      .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
      .donut-wrap svg { width: 150px; height: 150px; flex: none; }
      .legenda { display: grid; gap: 7px; flex: 1; min-width: 150px; font-family: var(--mono); font-size: 0.75rem; }
      .legenda div { display: flex; align-items: center; gap: 8px; }
      .legenda i { width: 12px; height: 12px; border: 2px solid var(--tinta); flex: none; }
      .legenda span { flex: 1; overflow-wrap: anywhere; }
      .legenda b { white-space: nowrap; }
      .hb { display: grid; gap: 11px; }
      .hb-lin { display: grid; gap: 4px; font-family: var(--mono); font-size: 0.75rem; }
      .hb-top { display: flex; justify-content: space-between; gap: 10px; }
      .hb-top span:first-child { overflow-wrap: anywhere; font-weight: 700; }
      .hb-top span:last-child { white-space: nowrap; }
      .hb-trilho { height: 14px; border: 2px solid var(--tinta); background: var(--papel); }
      .hb-fill { height: 100%; background: var(--cor, var(--laranja)); }
      .sem-dados { font-family: var(--mono); font-size: 0.78rem; text-align: center; padding: 26px 8px; opacity: 0.7; }

      /* ---------- aviso ---------- */
      .aviso {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 50;
        max-width: min(92vw, 420px);
        padding: 12px 20px;
        font-weight: 800;
        text-align: center;
        background: var(--mostarda);
        border: 3px solid var(--tinta);
        box-shadow: 6px 6px 0 var(--tinta);
        transform: translateX(-50%);
        animation: sobe 0.3s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      @keyframes sobe { from { opacity: 0; transform: translateX(-50%) translateY(24px); } }

      /* ---------- recibo (só aparece na impressão) ---------- */
      #recibo { display: none; }
      @media print {
        @page { margin: 4mm; }
        body { background: #fff !important; }
        body > *:not(#recibo) { display: none !important; }
        #recibo {
          display: block;
          width: 72mm;
          margin: 0 auto;
          font: 12px/1.45 "Courier New", ui-monospace, monospace;
          color: #000;
        }
        #recibo h1 { font: 700 22px "Courier New", monospace; text-align: center; letter-spacing: 2px; }
        #recibo .c { text-align: center; }
        #recibo hr { border: 0; border-top: 1px dashed #000; margin: 8px 0; }
        #recibo .lin { display: flex; justify-content: space-between; gap: 8px; }
        #recibo .tot { font-weight: 700; font-size: 15px; margin-top: 4px; }
      }

      @media (max-width: 600px) {
        header { padding: 14px 16px; }
        header h3 { font-size: 1.5rem; }
        main { padding: 22px 14px 50px; }
        dialog.grande { padding: 18px 14px; }
        .grafico { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="marca">
        <div class="logo">CADÁRPIO</div>
        <h3>GESTÃO</h3>
      </div>
      <div class="topo-dir">
        <div class="conexao" id="conexao">Conectando...</div>
        <div class="data" id="data"></div>
      </div>
    </header>

    <main>
      <div class="stats">
        <div class="stat"><small>Pedidos hoje</small><strong id="sPedidos">0</strong></div>
        <button type="button" class="stat clicavel" id="cardFat" title="Ver detalhes do faturamento">
          <small>Faturamento hoje</small><strong id="sFat">R$ 0</strong>
          <span class="dica">Ver detalhes →</span>
        </button>
        <div class="stat"><small>Em aberto</small><strong id="sAberto">0</strong></div>
        <div class="stat"><small>Produtos no cardápio</small><strong id="sProd">0</strong></div>
      </div>

      <div class="abas">
        <button class="aba ativa" data-aba="pedidos">Pedidos <span class="n" id="nAberto">0</span></button>
        <button class="aba" data-aba="produtos">Produtos</button>
      </div>

      <section class="painel ativo" id="pedidos">
        <div class="titulo">
          <h2>Fila de pedidos</h2>
          <button class="mini del" id="limparEntregues">Limpar entregues</button>
        </div>
        <div class="filtros" id="filtros"></div>
        <div class="pedidos" id="listaPedidos"></div>
      </section>

      <section class="painel" id="produtos">
        <div class="titulo">
          <h2>Cardápio</h2>
          <button class="btn" id="novoProduto">Novo produto</button>
        </div>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr><th></th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr>
            </thead>
            <tbody id="listaProdutos"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="modal">
      <form id="form" novalidate>
        <h2 id="modalTitulo">Novo produto</h2>
        <div class="campos">
          <label>Nome<input id="fNome" autocomplete="off" /></label>
          <label>Descrição<textarea id="fDesc" rows="2"></textarea></label>
          <label>Preço (R$)<input id="fPreco" type="number" step="0.01" min="0" /></label>
          <label>Categoria
            <select id="fCat">
              <option value="lanche">Lanche</option>
              <option value="bebida">Bebida</option>
            </select>
          </label>
          <label>Foto (URL ou arquivo)
            <div class="linha-foto">
              <input id="fFoto" placeholder="https://..." />
              <button type="button" class="mini" id="fEscolher">Arquivo</button>
            </div>
            <input type="file" id="fArquivo" accept="image/*" hidden />
          </label>
          <p class="erro-form" id="fErro" role="alert" hidden></p>
        </div>
        <div class="modal-botoes">
          <button type="button" class="btn claro" id="fCancelar">Cancelar</button>
          <button type="submit" class="btn" id="fSalvar">Salvar</button>
        </div>
      </form>
    </dialog>

    <dialog id="modalFat" class="grande" aria-labelledby="fatTitulo">
      <div id="fatCorpo"></div>
      <div class="modal-botoes">
        <button type="button" class="btn claro" id="fatCsv">Exportar CSV</button>
        <button type="button" class="btn" id="fatFechar">Fechar</button>
      </div>
    </dialog>

    <div id="recibo" aria-hidden="true"></div>
    <div class="aviso" id="aviso" role="alert" hidden></div>

    <script>
      /* ---------- configuração (igual ao index.html) ---------- */
      const API_BASE = "https://mainpy-one.vercel.app";
      const PAINEL_ID = "cardapio-painel-7f3k";
      const CANAL_PAINEL = "cardapio-pedidos";
      const CHAVE_PEDIDOS = "gestao:pedidos";

      const $ = (id) => document.getElementById(id);
      const brl = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const esc = (t) =>
        String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      const lerLocal = (k, padrao) => {
        try { return JSON.parse(localStorage.getItem(k)) ?? padrao; } catch { return padrao; }
      };
      const salvarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

      let pedidos = lerLocal(CHAVE_PEDIDOS, []);
      let produtos = [];
      let filtro = "todos";
      let produtosStatus = "Carregando produtos...";

      const fluxo = ["novo", "preparo", "pronto", "entregue"];
      const rotulo = { novo: "Novo", preparo: "Em preparo", pronto: "Pronto", entregue: "Entregue" };
      const rotuloTipo = {
        Entrega: "Entrega",
        Retirada: "Retirada no local",
        "estou-no-local": "Está no local",
        "irei-pegar": "Vai retirar no estabelecimento",
      };

      const modalFat = $("modalFat");

      /* ---------- aviso ---------- */
      let tAviso;
      function aviso(texto) {
        const el = $("aviso");
        el.textContent = texto;
        el.hidden = false;
        clearTimeout(tAviso);
        tAviso = setTimeout(() => (el.hidden = true), 3500);
      }

      function bip() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "square";
          o.frequency.value = 880;
          g.gain.value = 0.05;
          o.connect(g).connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 0.18);
        } catch {}
      }

      /* ---------- stats ---------- */
      const ehHoje = (ts) => new Date(ts).toDateString() === new Date().toDateString();

      function renderStats() {
        const hoje = pedidos.filter((p) => ehHoje(p.recebidoEm));
        const abertos = pedidos.filter((p) => p.status !== "entregue").length;
        $("sPedidos").textContent = hoje.length;
        $("sFat").textContent = brl(hoje.reduce((s, p) => s + p.total, 0));
        $("sAberto").textContent = abertos;
        $("nAberto").textContent = abertos;
        $("sProd").textContent = produtos.length;
        if (modalFat.open) renderFat();
      }

      /* ---------- pedidos ---------- */
      function renderFiltros() {
        const opcoes = [["todos", "Todos"], ...fluxo.map((s) => [s, rotulo[s]])];
        $("filtros").innerHTML = opcoes
          .map(([k, t]) => {
            const n = k === "todos" ? pedidos.length : pedidos.filter((p) => p.status === k).length;
            return `<button class="chip ${filtro === k ? "ativo" : ""}" data-f="${k}">${t} (${n})</button>`;
          })
          .join("");
      }

      function renderPedidos(novoId) {
        renderFiltros();
        const el = $("listaPedidos");
        const lista = pedidos
          .filter((p) => filtro === "todos" || p.status === filtro)
          .sort((a, b) => b.recebidoEm - a.recebidoEm);
        if (!lista.length) {
          el.innerHTML = '<p class="vazio">Nenhum pedido por aqui. Mantenha esta página aberta para receber.</p>';
          return;
        }
        el.innerHTML = lista
          .map((p) => {
            const hora = new Date(p.recebidoEm).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
            const local =
              p.tipo === "Entrega" && p.endereco
                ? `<span><em>Endereço:</em> ${esc(p.endereco)}</span>`
                : p.tipo === "estou-no-local" && p.mesa
                  ? `<span><em>Mesa:</em> ${esc(p.mesa)}</span>`
                  : "";
            return `
          <article class="pedido ${p.id === novoId ? "novo" : ""}">
            <div class="pedido-topo">
              <b>#${esc(String(p.id).slice(-4).toUpperCase())}</b>
              <span class="hora">${hora}</span>
            </div>
            <div class="pedido-cli">${esc(p.nome)}</div>
            <div class="info">
              <span><em>Tipo:</em> ${esc(rotuloTipo[p.tipo] || p.tipo)}</span>
              ${local}
              <span><em>Pagamento:</em> ${esc(p.pagamento)}</span>
            </div>
            ${p.obs ? `<div class="obs">${esc(p.obs)}</div>` : ""}
            <ul>${p.itens
              .map(
                (i) =>
                  `<li><span>${esc(i.quantidade)}x ${esc(i.nome)}</span><span>${
                    i.valor != null ? brl(i.valor * i.quantidade) : ""
                  }</span></li>`,
              )
              .join("")}</ul>
            <div class="pedido-rodape">
              <span class="total">${brl(p.total)}</span>
              <div class="pedido-acoes">
                <button class="status ${p.status}" data-a="avancar" data-id="${esc(p.id)}" title="Avançar status">${rotulo[p.status]}</button>
                <button class="mini" data-a="imprimir" data-id="${esc(p.id)}">Imprimir</button>
                <button class="mini del" data-a="excluir" data-id="${esc(p.id)}">Excluir</button>
              </div>
            </div>
          </article>`;
          })
          .join("");
      }

      function salvarPedidos() { salvarLocal(CHAVE_PEDIDOS, pedidos); }

      function imprimirRecibo(p) {
        const data = new Date(p.recebidoEm).toLocaleString("pt-BR");
        const local =
          p.tipo === "Entrega" && p.endereco
            ? `<div>Endereço: ${esc(p.endereco)}</div>`
            : p.tipo === "estou-no-local" && p.mesa
              ? `<div>Mesa: ${esc(p.mesa)}</div>`
              : "";
        $("recibo").innerHTML = `
          <h1>CADÁRPIO</h1>
          <div class="c">Recibo do pedido #${esc(String(p.id).slice(-4).toUpperCase())}</div>
          <div class="c">${esc(data)}</div>
          <hr />
          <div>Cliente: ${esc(p.nome)}</div>
          <div>Tipo: ${esc(rotuloTipo[p.tipo] || p.tipo)}</div>
          ${local}
          <div>Pagamento: ${esc(p.pagamento)}</div>
          <hr />
          ${p.itens
            .map(
              (i) =>
                `<div class="lin"><span>${esc(i.quantidade)}x ${esc(i.nome)}</span><span>${
                  i.valor != null ? brl(i.valor * i.quantidade) : ""
                }</span></div>`,
            )
            .join("")}
          <hr />
          <div class="lin tot"><span>TOTAL</span><span>${brl(p.total)}</span></div>
          ${p.obs ? `<hr /><div>Obs: ${esc(p.obs)}</div>` : ""}
          <hr />
          <div class="c">Obrigado pela preferência!</div>`;
        window.print();
      }

      $("listaPedidos").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-a]");
        if (!b) return;
        const p = pedidos.find((x) => x.id === b.dataset.id);
        if (!p) return;
        if (b.dataset.a === "imprimir") return imprimirRecibo(p);
        if (b.dataset.a === "excluir") {
          if (!confirm(`Excluir o pedido de ${p.nome}?`)) return;
          pedidos = pedidos.filter((x) => x !== p);
        } else {
          p.status = fluxo[(fluxo.indexOf(p.status) + 1) % fluxo.length];
          notificarStatus(p);
        }
        salvarPedidos();
        renderPedidos();
        renderStats();
      });

      $("filtros").addEventListener("click", (e) => {
        const c = e.target.closest("[data-f]");
        if (!c) return;
        filtro = c.dataset.f;
        renderPedidos();
      });

      $("limparEntregues").addEventListener("click", () => {
        const n = pedidos.filter((p) => p.status === "entregue").length;
        if (!n) return aviso("Nenhum pedido entregue para limpar.");
        if (!confirm(`Excluir ${n} pedido(s) entregue(s)?`)) return;
        pedidos = pedidos.filter((p) => p.status !== "entregue");
        salvarPedidos();
        renderPedidos();
        renderStats();
      });

      /* ---------- faturamento detalhado ---------- */
      const DIA = 864e5;
      const CORES = ["#ff6a13", "#ffc233", "#d62828", "#2f9e44", "#1b1410", "#8a5a2b"];
      const ROTULO_PERIODO = { hoje: "Hoje", 7: "7 dias", 30: "30 dias" };
      let periodoFat = "hoje";

      const inicioDia = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
      const fmtNum = (v, max = 1) => Number(v).toLocaleString("pt-BR", { maximumFractionDigits: max });
      const fmtData = (t) => new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });

      function janelaFat() {
        const n = periodoFat === "hoje" ? 1 : Number(periodoFat);
        const ini = inicioDia(Date.now()) - (n - 1) * DIA;
        return { n, ini, fim: ini + n * DIA, iniAnt: ini - n * DIA };
      }

      function bonito(max) {
        const p = Math.pow(10, Math.floor(Math.log10(max)));
        const f = max / p;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
      }

      function compacto(v) {
        return v >= 1000 ? `R$ ${fmtNum(v / 1000)} mil` : `R$ ${fmtNum(v, 2)}`;
      }

      function delta(atual, anterior) {
        if (!anterior) return `<span class="delta">${atual ? "novo" : "—"}</span>`;
        const v = ((atual - anterior) / anterior) * 100;
        const cls = v > 0.05 ? "up" : v < -0.05 ? "down" : "";
        const seta = v > 0.05 ? "▲" : v < -0.05 ? "▼" : "■";
        return `<span class="delta ${cls}">${seta} ${fmtNum(Math.abs(v))}%</span>`;
      }

      function graficoBarras(labels, vals, qts, unidade) {
        const W = 640, H = 250, m = { t: 14, r: 12, b: 30, l: 62 };
        const iw = W - m.l - m.r, ih = H - m.t - m.b;
        const maximo = Math.max(...vals, 0);
        const topo = bonito(Math.max(maximo, 1));
        const pico = maximo > 0 ? vals.indexOf(maximo) : -1;
        const bw = iw / vals.length;
        const larg = Math.max(3, bw * 0.7);
        const passo = Math.ceil(vals.length / 12);
        let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por ${unidade}" style="width:100%;height:auto;display:block">`;
        for (let k = 0; k <= 4; k++) {
          const y = m.t + ih - (ih * k) / 4;
          s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="#1b1410" stroke-opacity="${k ? 0.18 : 1}" stroke-width="${k ? 1 : 2}" ${k ? 'stroke-dasharray="4 4"' : ""}/>`;
          s += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end" font-family="Space Mono, monospace" font-size="10" fill="#1b1410">${compacto((topo * k) / 4)}</text>`;
        }
        vals.forEach((v, i) => {
          const cx = m.l + i * bw + bw / 2;
          if (v > 0) {
            const h = Math.max(2, (v / topo) * ih);
            s += `<rect x="${cx - larg / 2}" y="${m.t + ih - h}" width="${larg}" height="${h}" fill="${i === pico ? "#d62828" : "#ff6a13"}" stroke="#1b1410" stroke-width="2"><title>${esc(labels[i])}: ${brl(v)} · ${qts[i]} pedido(s)</title></rect>`;
          }
          if (i % passo === 0) {
            s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#1b1410">${esc(labels[i])}</text>`;
          }
        });
        return s + "</svg>";
      }

      function graficoRosca(itens, total) {
        const r = 54, c = 2 * Math.PI * r;
        let acc = 0;
        let arcos = "";
        itens.forEach((it, i) => {
          const len = (it.valor / total) * c;
          arcos += `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${CORES[i % CORES.length]}" stroke-width="28" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${esc(it.nome)}: ${brl(it.valor)}</title></circle>`;
          acc += len;
        });
        const svg = `<svg viewBox="0 0 160 160" role="img" aria-label="Faturamento por forma de pagamento">
          <circle cx="80" cy="80" r="68" fill="none" stroke="#1b1410" stroke-width="2"/>
          <circle cx="80" cy="80" r="40" fill="none" stroke="#1b1410" stroke-width="2"/>
          ${arcos}
          <text x="80" y="76" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" fill="#1b1410">TOTAL</text>
          <text x="80" y="92" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="14" fill="#1b1410">${esc(compacto(total))}</text>
        </svg>`;
        const legenda = itens
          .map(
            (it, i) =>
              `<div><i style="background:${CORES[i % CORES.length]}"></i><span>${esc(it.nome)}</span><b>${fmtNum((it.valor / total) * 100)}%</b></div>`,
          )
          .join("");
        return `<div class="donut-wrap">${svg}<div class="legenda">${legenda}</div></div>`;
      }

      function barrasH(itens, cor) {
        const max = Math.max(...itens.map((i) => i.valor), 1);
        return `<div class="hb">${itens
          .map(
            (it) => `<div class="hb-lin">
              <div class="hb-top"><span>${esc(it.nome)}</span><span>${esc(it.texto)}</span></div>
              <div class="hb-trilho"><div class="hb-fill" style="width:${Math.max(3, (it.valor / max) * 100)}%;${cor ? `--cor:${cor}` : ""}"></div></div>
            </div>`,
          )
          .join("")}</div>`;
      }

      function somarPor(lista, chave) {
        const m = new Map();
        lista.forEach((p) => m.set(chave(p), (m.get(chave(p)) || 0) + p.total));
        return [...m].map(([nome, valor]) => ({ nome, valor })).sort((a, b) => b.valor - a.valor);
      }

      function renderFat() {
        const { n, ini, fim, iniAnt } = janelaFat();
        const atual = pedidos.filter((p) => p.recebidoEm >= ini && p.recebidoEm < fim);
        const ant = pedidos.filter((p) => p.recebidoEm >= iniAnt && p.recebidoEm < ini);
        const soma = (l) => l.reduce((s, p) => s + p.total, 0);
        const fat = soma(atual), fatAnt = soma(ant);
        const ticket = atual.length ? fat / atual.length : 0;
        const ticketAnt = ant.length ? fatAnt / ant.length : 0;
        const maior = atual.reduce((m, p) => Math.max(m, p.total), 0);
        const qtdItens = atual.reduce((s, p) => s + p.itens.reduce((a, i) => a + i.quantidade, 0), 0);
        const vsTxt = n === 1 ? "vs ontem" : `vs ${n} dias antes`;

        // série temporal
        const nb = n === 1 ? 24 : n;
        const vals = new Array(nb).fill(0), qts = new Array(nb).fill(0);
        atual.forEach((p) => {
          const i = n === 1 ? new Date(p.recebidoEm).getHours() : Math.min(nb - 1, Math.floor((p.recebidoEm - ini) / DIA));
          vals[i] += p.total;
          qts[i]++;
        });
        const labels = vals.map((_, i) => (n === 1 ? `${String(i).padStart(2, "0")}h` : fmtData(ini + i * DIA)));
        const maxVal = Math.max(...vals);
        const iPico = maxVal > 0 ? vals.indexOf(maxVal) : -1;

        // quebras
        const pagamentos = somarPor(atual, (p) => p.pagamento || "Não informado");
        const tipos = somarPor(atual, (p) => rotuloTipo[p.tipo] || p.tipo || "Não informado").map((t) => ({
          ...t,
          texto: `${brl(t.valor)} · ${fmtNum((t.valor / fat) * 100)}%`,
        }));
        const porProduto = new Map();
        atual.forEach((p) =>
          p.itens.forEach((i) => {
            const o = porProduto.get(i.nome) || { valor: 0, qtd: 0 };
            o.valor += (i.valor ?? 0) * i.quantidade;
            o.qtd += i.quantidade;
            porProduto.set(i.nome, o);
          }),
        );
        const top = [...porProduto]
          .map(([nome, o]) => ({ nome, valor: o.valor, texto: `${o.qtd}x · ${brl(o.valor)}` }))
          .sort((a, b) => b.valor - a.valor)
          .slice(0, 6);
        const status = fluxo
          .map((s) => ({ nome: rotulo[s], valor: atual.filter((p) => p.status === s).length }))
          .map((s) => ({ ...s, texto: `${s.valor} pedido(s)` }));

        const periodoTxt =
          n === 1
            ? new Date(ini).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
            : `${fmtData(ini)} a ${fmtData(fim - 1)}`;

        const vazio = '<p class="sem-dados">Sem pedidos neste período.</p>';

        $("fatCorpo").innerHTML = `
          <div class="fat-topo">
            <div>
              <h2 id="fatTitulo">Faturamento</h2>
              <p>${esc(periodoTxt)}</p>
            </div>
            <div class="fat-ctrl">
              <div class="seg" role="group" aria-label="Período">
                ${Object.keys(ROTULO_PERIODO)
                  .map((k) => `<button type="button" data-p="${k}" class="${String(periodoFat) === k ? "ativo" : ""}">${ROTULO_PERIODO[k]}</button>`)
                  .join("")}
              </div>
            </div>
          </div>

          <div class="kpis">
            <div class="kpi destaque"><small>Faturamento</small><strong>${brl(fat)}</strong><div class="sub">${delta(fat, fatAnt)} ${vsTxt}</div></div>
            <div class="kpi"><small>Pedidos</small><strong>${atual.length}</strong><div class="sub">${delta(atual.length, ant.length)} ${vsTxt}</div></div>
            <div class="kpi"><small>Ticket médio</small><strong>${brl(ticket)}</strong><div class="sub">${delta(ticket, ticketAnt)} ${vsTxt}</div></div>
            <div class="kpi"><small>Maior pedido</small><strong>${brl(maior)}</strong><div class="sub">${qtdItens} item(ns) vendidos</div></div>
            <div class="kpi"><small>${n === 1 ? "Horário de pico" : "Melhor dia"}</small><strong>${iPico >= 0 ? esc(labels[iPico]) : "—"}</strong><div class="sub">${iPico >= 0 ? `${brl(maxVal)} · ${qts[iPico]} pedido(s)` : "sem vendas"}</div></div>
          </div>

          <div class="graficos">
            <div class="grafico largo">
              <h4>Faturamento por ${n === 1 ? "hora" : "dia"}</h4>
              <p class="leg">Barra vermelha = ${n === 1 ? "hora" : "dia"} de maior faturamento. Passe o mouse para ver detalhes.</p>
              ${graficoBarras(labels, vals, qts, n === 1 ? "hora" : "dia")}
            </div>
            <div class="grafico">
              <h4>Formas de pagamento</h4>
              <p class="leg">Participação no faturamento</p>
              ${atual.length && fat > 0 ? graficoRosca(pagamentos, fat) : vazio}
            </div>
            <div class="grafico">
              <h4>Tipo de pedido</h4>
              <p class="leg">Entrega, retirada e consumo no local</p>
              ${atual.length && fat > 0 ? barrasH(tipos, "#ffc233") : vazio}
            </div>
            <div class="grafico">
              <h4>Produtos que mais faturam</h4>
              <p class="leg">Top 6 por valor vendido</p>
              ${top.length ? barrasH(top, "#ff6a13") : vazio}
            </div>
            <div class="grafico">
              <h4>Pedidos por status</h4>
              <p class="leg">Situação atual dos pedidos do período</p>
              ${atual.length ? barrasH(status, "#2f9e44") : vazio}
            </div>
          </div>`;
      }

      function exportarCsv() {
        const { ini, fim } = janelaFat();
        const lista = pedidos.filter((p) => p.recebidoEm >= ini && p.recebidoEm < fim).sort((a, b) => a.recebidoEm - b.recebidoEm);
        if (!lista.length) return aviso("Sem pedidos no período para exportar.");
        const cel = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
        const linhas = [["Pedido", "Data", "Cliente", "Tipo", "Pagamento", "Status", "Itens", "Total"].map(cel).join(";")];
        lista.forEach((p) =>
          linhas.push(
            [
              String(p.id).slice(-4).toUpperCase(),
              new Date(p.recebidoEm).toLocaleString("pt-BR"),
              p.nome,
              rotuloTipo[p.tipo] || p.tipo,
              p.pagamento,
              rotulo[p.status],
              p.itens.map((i) => `${i.quantidade}x ${i.nome}`).join(" + "),
              p.total.toFixed(2).replace(".", ","),
            ]
              .map(cel)
              .join(";"),
          ),
        );
        const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `faturamento-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      $("cardFat").addEventListener("click", () => {
        periodoFat = "hoje";
        renderFat();
        modalFat.showModal();
      });
      $("fatFechar").addEventListener("click", () => modalFat.close());
      $("fatCsv").addEventListener("click", exportarCsv);
      $("fatCorpo").addEventListener("click", (e) => {
        const b = e.target.closest("[data-p]");
        if (!b) return;
        periodoFat = b.dataset.p;
        renderFat();
      });

      /* ---------- recebimento de pedidos (cardápio -> gestão) ---------- */
      function receber(d) {
        if (!d || typeof d !== "object" || typeof d.id !== "string" || !Array.isArray(d.itens)) return false;
        if (pedidos.some((p) => p.id === d.id)) return true; // já recebido (BroadcastChannel + PeerJS)
        const itens = d.itens.map((i) => ({
          nome: String(i?.nome ?? ""),
          quantidade: Number(i?.quantidade) || 1,
          valor: Number.isFinite(i?.valor) ? i.valor : null,
        }));
        pedidos.push({
          id: d.id,
          nome: String(d.nome ?? "Cliente"),
          tipo: String(d.tipo ?? ""),
          mesa: String(d.mesa ?? ""),
          endereco: String(d.endereco ?? ""),
          pagamento: String(d.pagamento ?? ""),
          obs: String(d.obs ?? ""),
          total: Number.isFinite(d.total) ? d.total : 0,
          itens,
          status: "novo",
          recebidoEm: Date.now(),
        });
        salvarPedidos();
        renderPedidos(d.id);
        renderStats();
        aviso(`Novo pedido de ${d.nome ?? "cliente"}!`);
        bip();
        return true;
      }

      try {
        new BroadcastChannel(CANAL_PAINEL).onmessage = (e) => receber(e.data);
      } catch {}

      /* ---------- acompanhamento do cliente (gestão -> cardápio) ---------- */
      const CANAL_STATUS = "cardapio-status";
      const acompanhantes = new Map(); // id do pedido -> conexões de clientes
      let canalStatus = null;
      try {
        canalStatus = new BroadcastChannel(CANAL_STATUS);
        // mesmo aparelho: o cardápio pergunta o status dos pedidos dele
        canalStatus.onmessage = (e) => {
          const d = e.data;
          if (!d || d.acao !== "consultar" || !Array.isArray(d.ids)) return;
          for (const id of d.ids) {
            const p = pedidos.find((x) => x.id === id);
            if (p) canalStatus.postMessage({ acao: "status", id, status: p.status });
          }
        };
      } catch {}

      function notificarStatus(p) {
        try { canalStatus?.postMessage({ acao: "status", id: p.id, status: p.status }); } catch {}
        for (const conn of acompanhantes.get(p.id) ?? []) {
          try { if (conn.open) conn.send({ acao: "status", id: p.id, status: p.status }); } catch {}
        }
      }

      let peer;
      let tentativa;
      function conexao(ok, texto) {
        const el = $("conexao");
        el.classList.toggle("on", ok);
        el.textContent = texto;
      }

      function iniciarPeer() {
        clearTimeout(tentativa);
        try { peer?.destroy(); } catch {}
        try {
          peer = new Peer(PAINEL_ID);
        } catch {
          conexao(false, "Sem conexão");
          return;
        }
        peer.on("open", () => conexao(true, "Recebendo pedidos"));
        peer.on("connection", (conn) => {
          conn.on("data", (d) => {
            // cliente pedindo para acompanhar pedidos
            if (d && d.acao === "acompanhar" && Array.isArray(d.ids)) {
              for (const id of d.ids) {
                if (typeof id !== "string") continue;
                if (!acompanhantes.has(id)) acompanhantes.set(id, new Set());
                acompanhantes.get(id).add(conn);
                const p = pedidos.find((x) => x.id === id);
                if (p) {
                  try { conn.send({ acao: "status", id, status: p.status }); } catch {}
                }
              }
              return;
            }
            const ok = receber(d);
            try { conn.send({ ok }); } catch {}
          });
          conn.on("close", () => {
            for (const set of acompanhantes.values()) set.delete(conn);
          });
        });
        peer.on("disconnected", () => {
          conexao(false, "Reconectando...");
          try { peer.reconnect(); } catch {}
        });
        peer.on("error", (err) => {
          conexao(false, err.type === "unavailable-id" ? "Gestão aberta em outra aba" : "Sem conexão");
          tentativa = setTimeout(iniciarPeer, 8000);
        });
      }

      /* ---------- produtos (API) ---------- */
      function urlImagem(caminho) {
        if (!caminho) return "";
        try { return new URL(caminho, API_BASE + "/").href; } catch { return ""; }
      }

      async function api(caminho, opcoes) {
        const r = await fetch(API_BASE + caminho, opcoes);
        if (!r.ok) {
          let msg = `Erro ${r.status}`;
          try {
            const j = await r.json();
            if (typeof j.detail === "string") msg = j.detail;
          } catch {}
          throw new Error(msg);
        }
        return r.json();
      }

      async function carregarProdutos() {
        produtosStatus = "Carregando produtos...";
        renderProdutos();
        try {
          const [lanches, bebidas] = await Promise.all([api("/produtos"), api("/suco")]);
          produtos = [
            ...lanches.map((p) => ({ ...p, categoria: "lanche" })),
            ...bebidas.map((p) => ({ ...p, categoria: "bebida" })),
          ];
          produtosStatus = "Nenhum produto cadastrado.";
        } catch (erro) {
          console.error(erro);
          produtos = [];
          produtosStatus = "Não foi possível carregar os produtos da API.";
        }
        renderProdutos();
        renderStats();
      }

      function renderProdutos() {
        const el = $("listaProdutos");
        if (!produtos.length) {
          el.innerHTML = `<tr><td colspan="5" class="vazio">${esc(produtosStatus)}</td></tr>`;
          return;
        }
        el.innerHTML = produtos
          .map(
            (p) => `
          <tr>
            <td>${p.url_foto ? `<img src="${esc(urlImagem(p.url_foto))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />` : "<img alt='' style='visibility:hidden' />"}</td>
            <td>${esc(p.nome)}<small>${esc(p.descricao)}</small></td>
            <td><span class="tag ${p.categoria}">${p.categoria === "bebida" ? "Bebida" : "Lanche"}</span></td>
            <td class="preco">${brl(p.valor)}</td>
            <td><div class="acoes">
              <button class="mini" data-a="editar" data-id="${p.id_produto}">Trocar</button>
              <button class="mini del" data-a="excluir" data-id="${p.id_produto}">Excluir</button>
            </div></td>
          </tr>`,
          )
          .join("");
      }

      $("listaProdutos").addEventListener("click", async (e) => {
        const b = e.target.closest("button[data-a]");
        if (!b) return;
        const p = produtos.find((x) => x.id_produto === Number(b.dataset.id));
        if (!p) return;
        if (b.dataset.a === "editar") return abrirModal(p);
        if (!confirm(`Excluir "${p.nome}" do cardápio?`)) return;
        b.disabled = true;
        try {
          await api(`/produtos/${p.id_produto}`, { method: "DELETE" });
          aviso("Produto excluído.");
          await carregarProdutos();
        } catch (erro) {
          b.disabled = false;
          aviso(`Não foi possível excluir: ${erro.message}`);
        }
      });

      /* ---------- modal de produto ---------- */
      const modal = $("modal");
      let editando = null;
      let fotoArquivo = null;

      function abrirModal(p = null) {
        editando = p;
        fotoArquivo = null;
        $("modalTitulo").textContent = p ? "Trocar produto" : "Novo produto";
        $("fNome").value = p?.nome ?? "";
        $("fDesc").value = p?.descricao ?? "";
        $("fPreco").value = p?.valor ?? "";
        $("fCat").value = p?.categoria ?? "lanche";
        if (p?.url_foto?.startsWith("data:")) {
          fotoArquivo = p.url_foto;
          $("fFoto").value = "[arquivo] imagem atual";
        } else {
          $("fFoto").value = p?.url_foto ?? "";
        }
        $("fErro").hidden = true;
        modal.showModal();
        $("fNome").focus();
      }

      $("novoProduto").addEventListener("click", () => abrirModal());
      $("fCancelar").addEventListener("click", () => modal.close());
      $("fEscolher").addEventListener("click", () => $("fArquivo").click());

      $("fArquivo").addEventListener("change", (e) => {
        const arq = e.target.files[0];
        if (!arq) return;
        if (!arq.type.startsWith("image/")) return erroForm("Escolha um arquivo de imagem.");
        if (arq.size > 3 * 1024 * 1024) return erroForm("Escolha uma imagem de até 3 MB.");
        const leitor = new FileReader();
        leitor.onload = () => {
          fotoArquivo = leitor.result;
          $("fFoto").value = `[arquivo] ${arq.name}`;
          $("fErro").hidden = true;
        };
        leitor.readAsDataURL(arq);
        e.target.value = "";
      });

      function erroForm(t) {
        $("fErro").textContent = t;
        $("fErro").hidden = false;
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nome = $("fNome").value.trim();
        const valor = parseFloat(String($("fPreco").value).replace(",", "."));
        if (!nome) return erroForm("Informe o nome do produto.");
        if (!Number.isFinite(valor) || valor <= 0) return erroForm("Informe um preço maior que zero.");
        let foto = $("fFoto").value.trim();
        if (foto.startsWith("[arquivo]") && fotoArquivo) foto = fotoArquivo;

        const corpo = JSON.stringify({
          nome,
          descricao: $("fDesc").value.trim(),
          valor,
          url_foto: foto,
          categoria: $("fCat").value,
        });
        const cab = { "Content-Type": "application/json" };

        $("fSalvar").disabled = true;
        try {
          if (editando) await api(`/produtos/${editando.id_produto}`, { method: "PUT", headers: cab, body: corpo });
          else await api("/produtos", { method: "POST", headers: cab, body: corpo });
          modal.close();
          aviso(editando ? "Produto atualizado." : "Produto adicionado.");
          await carregarProdutos();
        } catch (erro) {
          erroForm(`Não foi possível salvar: ${erro.message}`);
        } finally {
          $("fSalvar").disabled = false;
        }
      });

      /* ---------- abas e início ---------- */
      document.querySelectorAll(".aba").forEach((a) =>
        a.addEventListener("click", () => {
          document.querySelectorAll(".aba").forEach((x) => x.classList.remove("ativa"));
          document.querySelectorAll(".painel").forEach((x) => x.classList.remove("ativo"));
          a.classList.add("ativa");
          $(a.dataset.aba).classList.add("ativo");
        }),
      );

      $("data").textContent = new Date().toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "numeric",
        month: "long",
      });

      renderPedidos();
      renderStats();
      iniciarPeer();
      carregarProdutos();
    </script>
  </body>
</html>
